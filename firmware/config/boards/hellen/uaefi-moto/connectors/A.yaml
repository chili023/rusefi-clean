meta: config/boards/hellen_mm100_meta.h

pins:
  - pin: A1
    type: 12v
    function: "+12V Batterie / ECU-Versorgung (ueber F2 auf +12V_RAW)"

  - pin: A2
    meta: MM100_IN_VBATT
    class: analog_inputs
    type: 12v
    function: "Zuendung (Schluessel) (ohne Main-Relais identisch mit +12V)"
    ts_name: "___ Zuendung (Schluessel)"

  - pin: A3
    type: 12v
    function: "+12V Hallsensoren (A) (PTC F11 200 mA, gleiches Netz wie B1)"

  - pin: A4
    type: 12v
    function: "+5V Sensor (A1) (geschuetzte 5V)"

  - pin: A5
    type: 12v
    function: "+5V Sensor (A2)"

  - pin: A6
    type: gnd
    function: "Sensormasse (A1)"

  - pin: A7
    type: gnd
    function: "Sensormasse (A2)"

  - pin: A8
    type: gnd
    function: "Leistungsmasse (A1)"

  - pin: A9
    type: gnd
    function: "Leistungsmasse (A2)"

  - pin: A10
    type: gnd
    function: "Leistungsmasse (A3)"

  - pin: A11
    meta: MM100_INJ1
    class: outputs
    type: ls
    function: "Einspritzduese 1"
    ts_name: "___ Einspritzduese 1"

  - pin: A12
    meta: MM100_INJ2
    class: outputs
    type: ls
    function: "Einspritzduese 2"
    ts_name: "___ Einspritzduese 2"

  - pin: A13
    meta: MM100_IGN1
    class: outputs
    type: ign
    function: "Zuendspule 1 (fuer Spulen mit eingebauter Endstufe)"
    ts_name: "___ Zuendspule 1"

  - pin: A14
    meta: MM100_IGN2
    class: outputs
    type: ign
    function: "Zuendspule 2 (fuer Spulen mit eingebauter Endstufe)"
    ts_name: "___ Zuendspule 2"

  - pin: A15
    meta: MM100_INJ7
    class: outputs
    type: ls
    function: "GPPWM1 (mit Freilaufdiode)"
    ts_name: "___ GPPWM1"

  - pin: A16
    meta: MM100_INJ8
    class: outputs
    type: ls
    function: "GPPWM2 (mit Freilaufdiode)"
    ts_name: "___ GPPWM2"

  - pin: A17
    meta: MM100_IN_TPS_ANALOG
    class: analog_inputs
    type: av
    function: "TPS1"
    ts_name: "___ TPS1"

  - pin: A18
    meta: MM100_IN_CLT_ANALOG
    class: analog_inputs
    type: av
    function: "CLT"
    ts_name: "___ CLT"

  - pin: A19
    meta: MM100_IN_IAT_ANALOG
    class: analog_inputs
    type: av
    function: "IAT"
    ts_name: "___ IAT"

  - pin: A20
    meta: MM100_IN_D1
    class: event_inputs
    type: hall
    function: "Hall 1 (Kurbelwelle) (4,7k Pull-up, Trigger in Firmware)"
    ts_name: "___ Hall 1 (Kurbelwelle)"

  - pin: A21
    type: wbo
    function: "Lambda 1 Heizung + (LSU Pin 4) (kalt kurz bis 2 A)"

  - pin: A22
    type: wbo
    function: "Lambda 1 Heizung - (LSU Pin 3) (kalt kurz bis 2 A)"

  - pin: A23
    type: wbo
    function: "Lambda 1 Ip (LSU Pin 1)"

  - pin: A24
    type: wbo
    function: "Lambda 1 Vm (LSU Pin 2)"

  - pin: A25
    type: wbo
    function: "Lambda 1 Un (LSU Pin 6)"

  - pin: A26
    type: wbo
    function: "Lambda 1 Rtrim (LSU Pin 5)"

  - pin: A27
    type: usb
    function: "USB VBUS (USB-Erkennung)"

  - pin: A28
    type: usb
    function: "USB D+ (verdrillt mit D-)"

  - pin: A29
    type: usb
    function: "USB D-"

  - pin: A30
    type: gnd
    function: "USB Masse"

  - pin: A31
    type: can
    function: "CAN High (intern auch Lambda-Module)"

  - pin: A32
    type: can
    function: "CAN Low"

  - pin: A33
    meta: MM100_IGN7
    class: outputs
    type: ls
    function: "schwacher Low-Side 1 (nur Relais, keine Freilaufdiode)"
    ts_name: "___ schwacher Low-Side 1"

  - pin: A34
    type: knock
    function: "Klopfsensor (Schirm auf Sensormasse)"

info:
  cid: a
  title: "Superseal 34 keying 1 - A (base)"
  name: uaefi-moto
  directory: hellen/uaefi-moto
